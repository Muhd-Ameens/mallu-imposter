<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Cards | Imposter</title>
<style>
:root {
  --bg:#060817; --panel:#10142b; --purple:#822cff;
  --pink:#e94dff; --text:#f5f3ff; --muted:#b6b5d3;
  --border:#292950;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; color:var(--text);
  font-family:Arial,sans-serif;
  background:radial-gradient(ellipse at top,#211047,var(--bg) 55%);
}
.container { max-width:560px; margin:auto; padding:22px 16px; }
.top { display:flex; justify-content:space-between; gap:10px; font-size:12px; color:#c8b8ff; }
.pill { border:1px solid #39305e; border-radius:30px; padding:9px 12px; }
h1 { text-align:center; margin:38px 0 8px; font-size:32px; }
.subtitle { text-align:center; color:var(--muted); font-size:14px; line-height:1.5; }
.progress { display:flex; gap:6px; margin:24px 0; }
.progress span { height:5px; flex:1; border-radius:5px; background:#242440; }
.progress span.done { background:var(--purple); }
.card {
  width:100%; min-height:290px; border-radius:24px; padding:28px 18px;
  border:2px solid #9d39ff;
  background:radial-gradient(ellipse at top,#2b165f,#0b0d23 75%);
  box-shadow:0 0 32px #862cff25;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; cursor:pointer; transition:.2s;
}
.card.revealed { border-color:var(--pink); cursor:default; }
.card .emoji { font-size:42px; margin-bottom:22px; }
.card h2 { font-size:clamp(27px,8vw,40px); margin:0; overflow-wrap:anywhere; }
.card p { color:#c8b8ff; line-height:1.5; }
.primary {
  display:block; width:100%; padding:16px; margin-top:16px;
  border:0; border-radius:13px; color:white; font-size:15px;
  font-weight:bold; cursor:pointer;
  background:linear-gradient(100deg,#6924ff,#a12dff);
}
.secondary { background:#12162c; border:1px solid #39305e; }
.note {
  margin-top:20px; border:1px solid var(--border); border-radius:13px;
  background:#0b1024; padding:16px; color:var(--muted);
  font-size:13px; line-height:1.6;
}
.note strong { color:#c58cff; }
.hidden { display:none !important; }
footer { text-align:center; color:#8d8aac; font-size:12px; padding:24px 0; }
</style>
</head>
<body>
<main class="container">
  <div class="top">
    <span class="pill" id="gameInfo">👥 3 Players | 1 Imposter</span>
    <span class="pill" id="languageLabel">🌐 English</span>
  </div>

  <h1 id="playerTitle">Player 1</h1>
  <div class="subtitle" id="instructions">Tap the card to reveal your secret.</div>

  <div class="progress" id="progress" aria-label="Player progress"></div>

  <div class="card" id="secretCard" role="button" tabindex="0"
       aria-label="Tap to reveal secret" onclick="revealCard()"
       onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();revealCard()}">
    <div class="emoji" id="cardEmoji">👾</div>
    <h2 id="cardTitle">?</h2>
    <p id="cardSub">TAP TO REVEAL</p>
  </div>

  <button class="primary" id="revealButton" onclick="revealCard()">◉ &nbsp; Reveal My Role</button>
  <button class="primary secondary hidden" id="hideButton" onclick="hideAndContinue()">🔒 &nbsp; Hide &amp; Next Player</button>

  <div class="note" id="note">
    <strong>💡 Remember...</strong><br>
    Keep your role secret. Don't show your card to anyone.
    Pass the phone only after hiding your card.
  </div>

  <footer>PLAYER <span id="playerNumber">1</span> OF <span id="totalPlayers">3</span></footer>
</main>

let settings, roles, word, hint, current = 0, revealed = false;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}
function getRandomHint(selectedWord) {
  const entry = Object.values(wordLists).flatMap(x => Object.values(x).flat())
    .find(x => x[0] === selectedWord);
  return entry ? entry[2] : "";
}
function loadGame() {
  try {
    settings = JSON.parse(localStorage.getItem("imposterSettings") || "null");
  } catch (e) { settings = null; }

  if (!settings || !settings.players || !settings.imposters) {
    window.location.replace("index.html");
    return false;
  }

  const pool = wordLists[settings.language]?.[settings.difficulty] || wordLists.en.easy;
  const selected = pool[Math.floor(Math.random() * pool.length)];
  word = selected[0];
  hint = selected[2];

  roles = Array(settings.players).fill("player");
  for (let i = 0; i < settings.imposters; i++) roles[i] = "imposter";
  shuffle(roles);

  localStorage.setItem("imposterRoles", JSON.stringify(roles));
  localStorage.setItem("imposterWord", word);
  localStorage.setItem("imposterHint", hint);
  localStorage.removeItem("imposterTimerEnd");

  document.getElementById("gameInfo").textContent =
    `👥 ${settings.players} Players | ${settings.imposters} Imposter${settings.imposters > 1 ? "s" : ""}`;
  document.getElementById("languageLabel").textContent =
    settings.language === "ml" ? "🌐 മലയാളം" : "🌐 English";
  document.getElementById("totalPlayers").textContent = settings.players;

  const progress = document.getElementById("progress");
  progress.innerHTML = "";
  for (let i = 0; i < settings.players; i++) {
    const segment = document.createElement("span");
    if (i === 0) segment.classList.add("done");
    progress.appendChild(segment);
  }
  showPlayer();
  return true;
}
function showPlayer() {
  revealed = false;
  const player = current + 1;
  document.getElementById("playerTitle").textContent = `Player ${player}`;
  document.getElementById("playerNumber").textContent = player;
  document.getElementById("instructions").textContent =
    "Pass the phone to Player " + player + ". Tap the card to see your role.";
  document.getElementById("cardEmoji").textContent = "👾";
  document.getElementById("cardTitle").textContent = "?";
  document.getElementById("cardSub").textContent = "TAP TO REVEAL";
  document.getElementById("secretCard").classList.remove("revealed");
  document.getElementById("revealButton").classList.remove("hidden");
  document.getElementById("hideButton").classList.add("hidden");
  document.getElementById("note").innerHTML =
    "<strong>💡 Remember...</strong><br>Keep your role secret. Don't show your card to anyone. Pass the phone only after hiding your card.";
  [...document.getElementById("progress").children].forEach((el, i) => {
    el.classList.toggle("done", i <= current);
  });
}
function revealCard() {
  if (revealed) return;
  revealed = true;
  const isImposter = roles[current] === "imposter";
  const card = document.getElementById("secretCard");
  card.classList.add("revealed");
  document.getElementById("cardEmoji").textContent = isImposter ? "😈" : "🔐";
  document.getElementById("cardTitle").textContent =
    isImposter ? "IMPOSTER" : word;
  document.getElementById("cardSub").textContent =
    isImposter ? "You don't know the secret word!" : "YOUR SECRET WORD";
  document.getElementById("instructions").textContent = "Memorize your role. Keep it secret!";
  document.getElementById("revealButton").classList.add("hidden");
  document.getElementById("hideButton").classList.remove("hidden");

  const hintLine = isImposter && settings.hints
    ? `<br><br><strong>Hint:</strong> ${hint}`
    : "";
  document.getElementById("note").innerHTML =
    `<strong>🔒 Keep it a secret!</strong><br>Don't let anyone else see your card.${hintLine}`;
}
function hideAndContinue() {
  if (!revealed) return;
  if (current < settings.players - 1) {
    current++;
    showPlayer();
  } else {
    // All players have seen their role. Clear the visible role before leaving.
    document.getElementById("cardTitle").textContent = "?";
    document.getElementById("cardEmoji").textContent = "👾";
    document.getElementById("cardSub").textContent = "";
    document.getElementById("secretCard").classList.remove("revealed");
    window.location.href = "imposter.html";
  }
}
loadGame();
